<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Sukusho - スクショ (Sukusho)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Navbar Admin (Sama seperti dashboard.html) -->
    <nav class="navbar navbar-expand-lg navbar-unsia sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-camera-fill text-accent-yellow fs-4"></i>
                <span class="fw-bold">スクショ</span>
                <span class="fs-6 text-muted ms-2">Admin Panel</span>
            </a>
        </div>
    </nav>

    <!-- Form Content -->
    <div class="container section-padding">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card-sukusho p-5">
                    <h2 class="text-unsia-blue mb-4">Unggah Sukusho Baru</h2>
                    
                    <form id="sukushoForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">Judul Error</label>
                            <input type="text" class="form-control form-control-lg" id="title" placeholder="Contoh: CORS Error pada API Fetch" required>
                        </div>
                        
                        <div class="row g-4 mb-4">
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Kategori</label>
                                <select class="form-select form-select-lg" id="category" required>
                                    <option value="">Pilih Kategori...</option>
                                    <option value="Frontend">Frontend (UI/CSS)</option>
                                    <option value="Backend">Backend (Logic/API)</option>
                                    <option value="Database">Database (SQL)</option>
                                </select>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label fw-bold">Status</label>
                                <select class="form-select form-select-lg" id="status">
                                    <option value="pending">Pending</option>
                                    <option value="solved">Solved</option>
                                </select>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Detail Masalah & Solusi</label>
                            <textarea class="form-control" id="description" rows="5" placeholder="Jelaskan konteks error dan solusinya..." required></textarea>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">Unggah Screenshot</label>
                            <input type="file" class="form-control form-control-lg" id="imageFile" accept="image/*" required>
                            <small class="text-muted">Format: JPG, PNG, WEBP. Maks 2MB.</small>
                        </div>

                        <div class="d-flex justify-content-end gap-2">
                            <a href="dashboard.html" class="btn btn-outline-secondary px-4">Batal</a>
                            <button type="submit" class="btn btn-primary-unsia px-4" id="submitBtn">
                                <i class="bi bi-cloud-arrow-up me-1"></i> Publikasikan
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/form-sukusho.js"></script>
</body>
</html>
