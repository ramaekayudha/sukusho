<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Otentikasi - スクショ (Sukusho)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
    <style>
        body { background-color: var(--bg-light-gray); }
        .auth-wrapper { min-height: 100vh; display: flex; align-items: center; justify-content: center; }
        .auth-card { max-width: 450px; width: 100%; }
    </style>
</head>
<body>
    <div class="container auth-wrapper">
        <div class="card border-0 shadow-lg auth-card">
            <div class="card-body p-5">
                <div class="text-center mb-5">
                    <a href="index.html" class="text-decoration-none">
                        <i class="bi bi-camera-fill text-accent-yellow fs-2"></i>
                        <h3 class="d-inline-block fw-bold text-unsia-blue ms-2">スクショ</h3>
                    </a>
                    <p class="text-muted small mt-2">Masuk ke dasbor administrasi sistem.</p>
                </div>
                
                <form id="loginForm">
                    <div class="mb-3">
                        <label class="form-label small fw-bold text-muted">Alamat Email</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-envelope-fill text-muted"></i></span>
                            <input type="email" class="form-control border-start-0 py-2" placeholder="admin@sukusho.id" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small fw-bold text-muted">Kata Sandi</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock-fill text-muted"></i></span>
                            <input type="password" class="form-control border-start-0 py-2" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary-unsia py-2">Masuk Sistem</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
