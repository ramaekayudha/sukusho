<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - スクショ (Sukusho)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background-color: var(--bg-light-gray);">

    <!-- Navbar Admin -->
    <nav class="navbar navbar-expand-lg navbar-unsia sticky-top">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html">
                <i class="bi bi-camera-fill text-accent-yellow fs-4"></i>
                <span class="fw-bold">スクショ</span>
                <span class="fs-6 text-muted ms-2">Admin Panel</span>
            </a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav ms-auto align-items-center">
                    <li class="nav-item"><a class="nav-link active" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link" href="index.html">Lihat Website</a></li>
                    <li class="nav-item ms-lg-3 mt-3 mt-lg-0">
                        <a href="login.html" class="btn btn-outline-danger px-4">Logout</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Dashboard Content -->
    <div class="container section-padding">
        <div class="d-flex justify-content-between align-items-center mb-5">
            <div>
                <h1 class="h3 text-unsia-blue fw-bold mb-1">Manajemen Data Sukusho</h1>
                <p class="text-muted mb-0">Kelola seluruh tangkapan layar error yang ada di sistem.</p>
            </div>
            <a href="add-sukusho.html" class="btn btn-primary-unsia">
                <i class="bi bi-plus-lg me-1"></i> Tambah Sukusho
            </a>
        </div>

        <!-- Tabel Data Admin -->
        <div class="card-sukusho p-4 shadow-sm">
            <div class="table-responsive">
                <table class="table table-modern align-middle mb-0">
                    <thead>
                        <tr>
                            <th style="width: 50px;">ID</th>
                            <th>Screenshot</th>
                            <th>Judul Error</th>
                            <th>Kategori</th>
                            <th>Status</th>
                            <th class="text-end">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody">
                        <tr>
                            <td colspan="6" class="text-center text-muted py-5">
                                <div class="spinner-border spinner-border-sm text-primary me-2" role="status"></div>
                                Memuat data dari database...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="js/dashboard.js"></script>
</body>
</html>
